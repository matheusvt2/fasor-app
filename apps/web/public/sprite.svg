    <path d="M14 3v4h4M9 12h6M9 16h6" />
  </symbol>
  <symbol id="i-flag" viewBox="0 0 24 24">
    <path d="M6 21V4h11l-2 4 2 4H6" />
  </symbol>
  <symbol id="i-block" viewBox="0 0 24 24">
    <rect x="4" y="4" width="16" height="16" rx="2" />
    <path d="M4 12h16" />
  </symbol>
</svg>
