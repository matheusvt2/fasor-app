<?xml version="1.0" encoding="UTF-8"?>
<!--
  AR-7: the SVG icon sprite is one of the four things the service worker precaches, so
  it has to be a file of its own rather than markup inside the hashed bundle. Every
  `<use href="/sprite.svg#i-...">` under `apps/web/src` resolves here, and a unit test
  pins the referenced ids against this document.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24">
    <path d="M15 5l-7 7 7 7" />
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="M5 12l5 5 9-10" />
  </symbol>
  <symbol id="i-chev-right" viewBox="0 0 24 24">
    <path d="M9 6l6 6-6 6" />
  </symbol>
  <symbol id="i-layers" viewBox="0 0 24 24">
    <path d="M12 4l8 4-8 4-8-4z" />
    <path d="M4 12l8 4 8-4" />
    <path d="M4 16l8 4 8-4" />
  </symbol>
  <symbol id="i-book" viewBox="0 0 24 24">
    <path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 0-3 3z" />
    <path d="M5 4v16a3 3 0 0 1 3-3h11" />
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24">
    <path d="M6 6l12 12" />
    <path d="M18 6L6 18" />
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24">
    <path d="M12 5v14" />
    <path d="M5 12h14" />
  </symbol>
  <symbol id="i-archive" viewBox="0 0 24 24">
    <path d="M4 7h16" />
    <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12" />
    <path d="M10 12h4" />
  </symbol>
  <symbol id="i-image" viewBox="0 0 24 24">
    <rect x="4" y="5" width="16" height="14" rx="1.5" />
    <path d="M4 16l5-5 4 4 3-3 4 4" />
    <circle cx="15.5" cy="9.5" r="1.5" />
  </symbol>
  <symbol id="i-template" viewBox="0 0 24 24">
    <rect x="4" y="4" width="16" height="16" rx="2" />
    <path d="M4 10h16M10 10v10" />
  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24">
