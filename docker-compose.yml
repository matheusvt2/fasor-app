name: fasor

x-workspace: &workspace
  working_dir: /workspace
  volumes:
    - .:/workspace
    - node_modules_root:/workspace/node_modules
    - node_modules_domain:/workspace/packages/domain/node_modules
    - node_modules_api:/workspace/apps/api/node_modules
    - node_modules_web:/workspace/apps/web/node_modules
    - pnpm_store:/pnpm-store

x-app-env: &app-env
  RUNNING_IN_COMPOSE: '1'
  # One spelling of the database credentials: the postgres service reads the same variables.
  DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-app-files}
  PORT: ${PORT:-3000}
  SESSION_SECRET: ${SESSION_SECRET:-change-me-change-me-change-me-32ch}
  # better-auth's own origin (never derived from the request Host) and its CSRF allowlist:
  # the Vite dev servers on any localhost port (worktrees use different host ports), the
  # api itself, and the Caddy https origin of Story 1.7.
  AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:5173}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:5173,http://localhost:*,http://127.0.0.1:*,http://api:3000,http://web:5173,https://${TABLET_HOST:-localhost},https://${TABLET_HOST:-localhost}:${CADDY_HTTPS_PORT:-443}}
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  OCR_PROVIDER: ${OCR_PROVIDER:-fake}
  # Story 8.3: the OCR sidecar below (profile `ocr`); only the `ocr-svc` provider calls it.
  OCR_SERVICE_URL: ${OCR_SERVICE_URL:-http://ocr:8000}
  # Story 4.8: the generate worker runs in the api process; GENERATE_FAULT (TC-3) is
  # read only outside production and injects a LibreOffice timeout at the conversion step.
  # NODE_ENV stays unset here on purpose: the tools container inherits this anchor, and a
  # set NODE_ENV would turn Vitest's `test` mode and `vite build`'s production mode off.
  # An unset NODE_ENV is non-production for config.ts; only `api-prod` sets it.
  WORKER: ${WORKER:-1}
  GENERATE_FAULT: ${GENERATE_FAULT:-}
  # Security review 2026-09-30 (E11-A5): the sign-in and push request limits. Unset they are
  # off here (the gates sign in and push far faster than a person) and on in production;
  # `on` turns them on locally. Their sizes and the JSON body cap default in config.ts.
  RATE_LIMIT: ${RATE_LIMIT:-}
  npm_config_store_dir: /pnpm-store

# The api's health check, shared by `api` and `api-prod` (ECS declares its own, ecs.tf).
x-api-healthcheck: &api-healthcheck
  test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
  interval: 5s
  timeout: 5s
  retries: 30

services:
  postgres:
    # Pinned (security review 2026-09-30, I-2): tag for the reader, digest for the pull.
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    # Security review 2026-09-30 (I-5): long-running services come back after a daemon or
    # machine restart (a stopped project stays stopped); Postgres gets time to checkpoint.
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z@sha256:064117214caceaa8d8a90ef7caa58f2b2aeb316b5156afe9ee8da5b4d83e12c8
    command: server /data --console-address ':9001'
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot dependency install shared by web, api and tools.
  # E7-A7/E8-A2: `--trust-lockfile` skips pnpm 12's check of the committed lockfile against
  # the supply-chain policies (`minimumReleaseAge`), which fetches every entry's registry
  # metadata on each start, so a gate start needs no network once the store holds the
  # packages. The policies still apply where the lockfile is written (`pnpm install` or
  # `pnpm add` on a developer's machine), and a frozen lockfile cannot change here.
  install:
    build: ./apps/api
    image: app-api
    <<: *workspace
    environment: *app-env
    command: pnpm install --frozen-lockfile --trust-lockfile

  api:
    build: ./apps/api
    image: app-api
    <<: *workspace
    environment: *app-env
    command: pnpm --filter @app/api dev
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      install: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck: *api-healthcheck

  web:
    image: app-api
    <<: *workspace
    environment:
      <<: *app-env
      API_PROXY_TARGET: http://api:3000
      # Story 9.4: the Dictation engine (`webspeech`, `fake` or `none`); `build:e2e` sets `fake`.
      # E9-A9: default `none`; `webspeech` sends audio to the browser vendor and stays opt-in
      # until Matheus approves vendor audio (Q18).
      VITE_SPEECH_ENGINE: ${VITE_SPEECH_ENGINE:-none}
    command: pnpm --filter @app/web dev
    restart: unless-stopped
    # Security review 2026-09-30: loopback only. Vite listens on every interface inside the
    # container (`host: true`, which the published port needs), and a tablet on the LAN
    # reaches the app through Caddy (HTTPS, docs/tablet-https-setup.md), never the dev server.
    ports:
      - '127.0.0.1:5173:5173'
    depends_on:
      install: { condition: service_completed_successfully }
      api: { condition: service_healthy }

  # One-shot: generates the local CA + a leaf cert for $TABLET_HOST under
  # ./certs, which Caddy below mounts. No `image:` tag, so this never
  # collides with another worktree's compose project.
  mkcert:
    build: ./docker/mkcert
    environment:
      TABLET_HOST: ${TABLET_HOST:-localhost}
    volumes:
      - ./certs:/certs

  # Always-on TLS termination for tablets on the LAN: one secure-context
  # origin serving web + /api/* from the api container, no CORS.
  caddy:
    # The production edge's Caddy (infra/caddy/Dockerfile), same version and digest.
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    environment:
      TABLET_HOST: ${TABLET_HOST:-localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    depends_on:
      mkcert: { condition: service_completed_successfully }
      api: { condition: service_healthy }
    restart: unless-stopped

  # `prod` profile only -- forward-only Drizzle migrations as a one-shot
  # container before the prod api starts. `api-prod` below depends on this
  # completing successfully; both are `profiles: ['prod']`-only, so this
  # never affects the unprofiled default services.
  migrate:
    profiles: ['prod']
    build: ./apps/api
    <<: *workspace
    environment: *app-env
    command: pnpm --filter @app/api run migrate
    depends_on:
      install: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }

  # `prod` profile only -- approximates the future cloud image: serves the
  # built web bundle + /api/* from one container, JSON logs to stdout.
  # Reuses the bind-mounted dev image/workspace (no separate COPY-based
  # build stage needed); requires `pnpm --filter @app/web build` to have
  # run first so `apps/web/dist` exists.
  api-prod:
    profiles: ['prod']
    build: ./apps/api
    <<: *workspace
    environment:
      <<: *app-env
      # The prod profile never honours GENERATE_FAULT (config.ts reads it only outside production).
      # Production also refuses the public default SESSION_SECRET above: set your own in .env
      # (README "Running the prod profile"), and it turns the request limits on (RATE_LIMIT).
      NODE_ENV: production
    command: pnpm --filter @app/api start
    ports:
      - '127.0.0.1:${API_PROD_PORT:-3001}:3000'
    depends_on:
      install: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck: *api-healthcheck

  # Runs the merge gate: docker compose run --rm tools pnpm verify
  tools:
    profiles: ['tools']
    build:
      context: .
      dockerfile: Dockerfile.tools
    image: app-tools
    <<: *workspace
    environment:
      <<: *app-env
      # The Playwright-started `vite preview` on 5200 proxies /api through this, exactly as `web` does.
      API_PROXY_TARGET: http://api:3000
    depends_on:
      install: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      api: { condition: service_healthy }

  # Story 8.3: the stateless OCR sidecar (services/ocr). `ocr` profile only, so a plain
  # `docker compose up -d` never starts it and nothing depends on it. Weights are baked
  # into the image at build time; it never downloads at runtime.
  #   docker compose --profile ocr build ocr
  #   docker compose --profile ocr run --rm ocr pytest
  ocr:
    profiles: ['ocr']
    build:
      context: services/ocr
    image: app-ocr
    # A bound on a runaway, not a tight budget: the pytest run of this image peaked at 6.3 GiB
    # (measured 2026-09-30, no limit); 3 GiB killed it (exit 137).
    mem_limit: 8g
    ports:
      - '127.0.0.1:8000:8000'
    # Its health check is the image's own HEALTHCHECK (services/ocr/Dockerfile).

volumes:
  pgdata:
  miniodata:
  pnpm_store:
  node_modules_root:
  node_modules_domain:
  node_modules_api:
  node_modules_web:
